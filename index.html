<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>FHoC9 wiki</title>
		<link rel="stylesheet" href="reset.css">
		<link rel="stylesheet" href="main.css">
	</head>
	<body>
		<div id="titlecard">
			<h1 class="welcome">welcome to the</h1><p class="smol-text">unofficial</p><h1 class="welcome">FHoC9 wiki</h1>
		</div>
		<p>this wiki was made by Oblivious Catalyst with help from TrexRobot</p>
		<div class="nav">
			<div class="inner-grid">
				<h3 id="nav-head">nav:</h3>
				<button class="nav-btn" id="story-btn">story</button>
				<button class="nav-btn" id="enemy-btn">enemy behaviors</button>
				<button class="nav-btn" id="secrets-btn">secrets/easter eggs</button>
				<button class="nav-btn" id="act2-btn">act 2 speculation</button>
				<button class="nav-btn" id="VIam-btn">beating 6am</button>
				<button class="nav-btn" id="form-btn">suggestion box</button>
				<button class="nav-btn" id="download-btn">download game files</button>
			</div>
		</div>
		<div id="changelog-div">
			<h2>recent site changes:</h2>
			<md id="changelog"></md>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
		<script>
			fetch("changelog.md")      // The path to the raw Markdown file
				.then(response => response.blob())  // Unwrap to a blob...
				.then(blob => blob.text())          // ...then to raw text...
				.then(markdown => {                 // ...then pass the raw text into marked.parse
					document.getElementById("changelog").innerHTML = marked.parse(markdown);
				});
		</script>
		<script src="redirect.js"></script>
	</body>
</html>
